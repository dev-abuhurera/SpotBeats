<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/style/style2.css">
    <link rel="stylesheet" href="/style/utility.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" class="invert" sizes="16x16" type="image/png"
        href="https://open.spotifycdn.com/cdn/images/favicon16.1c487bff.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Butcherman&family=Martel+Sans:wght@600&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <title>SpotBeats - Web Player: Music for everyone</title>
</head>

<body>
    <div class="container flex bg-black">
        
        <div class="left">
            <div class="close">
                <img width="25px" class="invert close-img" src="/img/cross.svg" alt="cross">
            </div>
            <div class="home bg-gray rounded margin-1 padding-1">
                <div class="logo flex align-item"><img class="invert" src="/img/logo.svg" alt="logo">SpotBeats</div>
                <ul>
                    <li><img class="invert" src="/img/home.svg" alt="home">Home</li>
                    <li><img class="invert" src="/img/search.svg" alt="search">Search</li>
                </ul>
            </div>

            <div class="library bg-gray rounded padding-1 margin-1">
                <div class="heading flex align-item">
                    <h2>Your Library</h2>
                    <button><img class="invert justify-center" src="/img/plus.svg" alt="plus"></button>
                </div>

                <div class="songslist">
                    <ul>
                    </ul>
                </div>

                <div class="footer">
                    <div><a href="https://www.spotify.com/pk-en/legal/">Legal</a></div>
                    <div><a href="https://www.spotify.com/pk-en/safetyandprivacy/">Safety & Privacy Center</a></div>
                    <div><a href="https://www.spotify.com/pk-en/legal/privacy-policy/">Privacy Policy</a></div>
                    <div><a href="https://www.spotify.com/pk-en/legal/cookies-policy/">Cookies</a></div>
                    <div><a href="https://www.spotify.com/pk-en/legal/privacy-policy/#s3">About Ads</a></div>
                    <div><a href="https://www.spotify.com/pk-en/accessibility/">Accessibility</a></div>
                </div>
            </div>
        </div>

        <div class="right bg-gray rounded">
            <div class="header">
                <div class="nav">
                    <img src="/img/hamburger.svg" class="invert hamburger" alt="hamburger" height="20" width="20">
                    <img src="https://cdn.hugeicons.com/icons/arrow-left-01-stroke-sharp.svg" alt="back">
                    <img src="https://cdn.hugeicons.com/icons/arrow-right-01-stroke-standard.svg" alt="forward">
                </div>
                <div class="buttons">
                    <button>Sign Up</button>
                    <button>Login</button>
                </div>
            </div>



            <div class="spotifyPlaylists">
                <h1>SpotBeats Playlists</h1>
                
                <div class="card-container">
        
                </div>

            </div>

            <div class="playbar">

                <div class="songinfo">
                </div>
                <div class="songbuttons invert">
                    <img id="previous" width="23" src="https://cdn-icons-png.flaticon.com/512/8839/8839055.png"
                        alt="previous">
                    <img id="play" src="/img/playButton.svg" alt="play">
                    <img id="next" width="17" src="https://cdn-icons-png.flaticon.com/512/6364/6364389.png" alt="next">
                </div>

                <div class="voltime">

                    <div class="songtime"> </div>
                    <div class="volume-control">
                        <img src="/img/volume.png" alt="volume" class="volume-icon invert">
                        <input type="range" min="0" max="100" value="50" class="volume-slider">
                    </div>

                </div>

            </div>

            <div class="seekbar">
                <div class="circle"></div>
            </div>

        </div>
    </div>
    <script src="/script/script2.js"></script>
</body>

</html>
